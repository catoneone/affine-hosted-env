# Example gateway config. Relative paths are resolved against this file's directory.
db = "../runs/gateway.db"
key_file = "../keys/gateway.key"          # generated by hosted-env keygen; put the public key in worker.toml's gateway_public_key
roster = "roster.json"                    # qualified identity roster for this epoch (in production, from the opening snapshot)

[limits]
max_tasks_inflight = 9                    # tasks running at the same time per hotkey
max_tasks_per_epoch = 20                  # tasks started per hotkey per epoch (tasks voided by infra errors are refunded)
max_concurrent = 10                       # concurrent sessions per (hotkey, task)
idle_ttl = 900                            # session idle expiry (seconds)
max_containers = 0                        # global budget B of in-flight containers; 0 = limited only by worker capacity
infra_error_policy = "void"               # void: void the task, refund the quota slot, put the task back in the pool

[rate_limits]                             # token buckets: [per_sec, burst]; false disables; omitted scopes keep defaults
ip = [500, 1000]                          # per source IP, before authentication
hotkey_control = [5, 20]                  # per hotkey: tasks/open, sessions/open, tasks/finish
hotkey_data = [200, 400]                  # per hotkey: start / turn
total = [5000, 10000]                     # whole gateway

[workers]                                 # registered workers: worker_id = public key (hex)
w1 = "<w1 public key hex>"

[envs.mimo_swe]
kind = "mimo_swe"
tasks = "tasks.jsonl"                     # one per line: id/image/cwd/lang/problem_statement/test_patch/test_command
group_size = 8
success_reward = 1.0
